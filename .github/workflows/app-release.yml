name: Release Guardian APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-release
  cancel-in-progress: false

env:
  # Public API origin baked into the APK. Not a secret.
  API_BASE_URL: https://duxuelai.xyz/api

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/app-ci.yml
    permissions:
      contents: read

  download-test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/download-ci.yml
    permissions:
      contents: read

  release:
    needs: [test, download-test]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: duxue-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read tested Flutter SDK
        id: flutter_sdk
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_sdk.outputs.version }}
          cache: true
      - name: Restore signing key
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/duxue-app.keystore"
      - name: Build signed release APK
        id: build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/duxue-app.keystore
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_COMMIT="${GITHUB_SHA::7}" \
            --build-number="$GITHUB_RUN_NUMBER"
          APP_VERSION="$(awk '/^version:/ { print $2 }' pubspec.yaml)"
          ARTIFACT_NAME="guardian-${APP_VERSION%%+*}+${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/$ARTIFACT_NAME.apk"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/guardian-*.apk
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install download publisher
        working-directory: .
        run: python -m pip install -r scripts/download-requirements.txt
      - name: Publish download page and latest APK
        working-directory: .
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact_name }}
        run: |
          APP_VERSION="$(awk '/^version:/ { print $2 }' duxue-app/pubspec.yaml)"
          python scripts/publish-download.py \
            --apk "$RUNNER_TEMP/$ARTIFACT_NAME.apk" \
            --version "${APP_VERSION%%+*}" \
            --build "$GITHUB_RUN_NUMBER" \
            --commit "$GITHUB_SHA"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/duxue-app.keystore"
