name: Release Guardian APK

on:
  push:
    branches: [main]
    paths:
      - "duxue-app/**"
      - ".github/workflows/app-release.yml"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-release
  cancel-in-progress: false

env:
  # Public API origin baked into the APK. Not a secret.
  API_BASE_URL: https://duxuelai.xyz/api

jobs:
  test:
    uses: ./.github/workflows/app-ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: duxue-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/duxue-app.keystore"
      - name: Build signed release APK
        id: build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/duxue-app.keystore
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_COMMIT="${GITHUB_SHA::7}" \
            --build-number="$GITHUB_RUN_NUMBER"
          APP_VERSION="$(awk '/^version:/ { print $2 }' pubspec.yaml)"
          ARTIFACT_NAME="guardian-${APP_VERSION%%+*}+${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/$ARTIFACT_NAME.apk"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/guardian-*.apk
          if-no-files-found: error
