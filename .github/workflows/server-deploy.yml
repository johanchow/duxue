name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "duxue-server/**"
      - ".github/workflows/server-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/duxue-server
  DEPLOY_ENVIRONMENT: production
  # Fixed for the single production ECS layout in docs/preparetion.md.
  DEPLOY_SERVER_USER: duxue
  DEPLOY_SERVER_PORT: "22"
  DEPLOY_PATH: /home/duxue/duxue-server
  # Non-interactive SSH: skip host-key pinning (single trusted ECS).
  SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

jobs:
  test:
    uses: ./.github/workflows/server-ci.yml
    permissions:
      contents: read

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: duxue-server
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_ENVIRONMENT }}
      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Upload Compose definition
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
        run: |
          scp $SSH_OPTS -P "$DEPLOY_SERVER_PORT" duxue-server/docker-compose.yml \
            "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST:$DEPLOY_PATH/docker-compose.yml"
      - name: Migrate and start services
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh $SSH_OPTS -p "$DEPLOY_SERVER_PORT" "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" \
            "cd '$DEPLOY_PATH' && \
             printf '%s' '$GHCR_PULL_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && \
             export ENV_FILE=.env.prod DUXUE_SERVER_IMAGE='${IMAGE_NAME}:${GITHUB_SHA}' && \
             docker compose --profile tools pull migrate && \
             docker compose --profile tools run --rm migrate && \
             docker compose pull api worker beat && \
             docker compose up -d --no-build api worker beat && \
             docker image prune -f"
      - name: Verify API health
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
        run: |
          # Nginx serves the API under /api; HOST must be the public domain (not bare IP) for HTTPS.
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused \
            "https://${DEPLOY_SERVER_HOST}/api/health"
