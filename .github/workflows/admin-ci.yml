name: Admin CI
on:
  workflow_call:
  push:
    paths: ["duxue-admin/**", ".github/workflows/admin-ci.yml"]
  pull_request:
    paths: ["duxue-admin/**", ".github/workflows/admin-ci.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: duxue-admin
    env:
      ADMIN_ENV: test
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/duxue-admin-test
      AGENT_ADMIN_INTERNAL_TOKEN: ci-test-only-internal-token-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: duxue-admin/.nvmrc
          cache: npm
          cache-dependency-path: duxue-admin/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
