name: Server CI

on:
  workflow_call:
  pull_request:
    paths:
      - "duxue-server/**"
      - "duxue-gateway/**"
      - "docs/technical/design-agent.md"
      - "docs/technical/agent-flow-current.md"
      - ".github/workflows/server-ci.yml"
permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      gateway-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway_test
          POSTGRES_DB: duxue_gateway_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_test -d duxue_gateway_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_GATEWAY_DATABASE_URL: postgresql+psycopg://gateway_test:gateway_test@127.0.0.1:5432/duxue_gateway_test_ci
      DATABASE_URL: sqlite:////tmp/duxue-server-ci.db
      LOCAL_UPLOAD_DIR: /tmp/duxue-server-ci-uploads
      SECRET_KEY: ci-test-only
      REDIS_URL: redis://127.0.0.1:6379/0
      VLM_API_KEY: ci-test-only
      STORAGE_BACKEND: local
      OTEL_SDK_DISABLED: "true"
      ENV_FILE: /dev/null
      GATEWAY_BINARY_PATH: ${{ github.workspace }}/duxue-gateway/dist/duxue-gateway
    defaults:
      run:
        working-directory: duxue-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: duxue-server/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: duxue-gateway/go.mod
          cache-dependency-path: duxue-gateway/go.sum
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build gateway for cross-language contract tests
        working-directory: duxue-gateway
        run: CGO_ENABLED=0 go build -o dist/duxue-gateway ./cmd/duxue-gateway
      - run: python -m pytest tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: duxue-server
          push: false
          tags: duxue-server:ci
      - name: Build isolated math executor
        uses: docker/build-push-action@v6
        with:
          context: duxue-server
          file: duxue-server/math_executor/Dockerfile
          load: true
          tags: duxue-math:ci
      - name: Verify isolated math execution
        run: python scripts/smoke_math_container.py duxue-math:ci
