name: Guardian App CI

on:
  pull_request:
    paths:
      - "duxue-app/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "duxue-app/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

concurrency:
  group: guardian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duxue-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
