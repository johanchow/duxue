name: Guardian App CI

on:
  workflow_call:
  pull_request:
    paths:
      - "duxue-app/**"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app-release.yml"
permissions:
  contents: read

concurrency:
  group: guardian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duxue-app
    steps:
      - uses: actions/checkout@v4
      - name: Read tested Flutter SDK
        id: flutter_sdk
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_sdk.outputs.version }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
