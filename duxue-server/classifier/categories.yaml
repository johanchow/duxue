# 分类层配置：类别定义与参考描述
# 用于"文本嵌入相似度"分类方式（方式 2）
#
# 每个类别提供 5~8 句典型描述作为参考向量基准。
# 新增类别：直接在此文件中添加新节，无需重训 VLM。
#
# 字段说明：
#   label:       最终输出的类别名称
#   icon:        显示用图标
#   references:  3~8 句典型行为描述（越多越准确）
#   fallback:    true 表示其他类别均无把握时使用此类别

categories:
  - label: "学习"
    icon: "📖"
    references:
      - "学生头部低下约 45°，右手握笔在练习本上横向书写，桌面可见课本和铅笔"
      - "学生低头翻阅书页，目光落在书本上，手指轻触书页边缘"
      - "学生坐直，双手放在桌面，专注地看着书本或练习册"
      - "学生右手握铅笔，在纸张上做题，左手按住练习本"
      - "学生面朝桌面，头部微低，手臂弯曲，正在阅读或书写"
      - "学生目光集中在桌面书本上，身体前倾，保持专注姿态"

  - label: "离开"
    icon: "🚶"
    references:
      - "画面中没有学生，座位空置，桌面可见书本和文具"
      - "学生已离开座位，画面中无人"
      - "学生站起身，正在移动离开画面"
      - "座椅空置，学生不在画面范围内"
      - "学生站立于画面边缘，身体已离开座位位置"

  - label: "走神/玩耍"
    icon: "🎮"
    fallback: true   # 无法确定时默认归入此类
    references:
      - "学生手中拿着一个玩具，头部低下看着玩具"
      - "学生目光朝向侧方或远方，并非看向桌面书本"
      - "学生坐在椅子上发呆，身体放松，目光空洞"
      - "学生在桌面上摆弄小玩意，双手反复移动非学习物品"
      - "学生侧身与他人说话，或向后转动身体"
      - "学生低头看手机屏幕，手机放在课本下方或桌面上"
      - "学生趴在桌面上，眼睛闭合，可能在休息或睡觉"

