# 分类层配置：类别定义与参考描述
# 用于"文本嵌入相似度"分类方式（方式 2）
#
# 每个类别提供 5~8 句典型描述作为参考向量基准。
# 新增类别：直接在此文件中添加新节，无需重训 VLM。
#
# 字段说明：
#   label:       最终输出的类别名称
#   icon:        显示用图标
#   references:  3~8 句典型行为描述（越多越准确）
#   fallback:    true 表示其他类别均无把握时使用此类别
#
# ─────────────────────────────────────────────────────────
# 【机位约束】所有参考描述都不得依赖眼睛、视线或面部表情。
#
# 实际摄像头架在被观察者侧后方约 45° 俯拍，看不到正脸。
# 判别信息按可靠性排序：
#   1. 手在做什么      （最高，握笔 vs 持手机 vs 摆弄玩物）
#   2. 桌面有什么      （最高，课本 vs 手机 vs 玩具）
#   3. 头朝哪个方向    （中，低头朝桌面 vs 转向侧方，不需看到眼睛）
#   4. 身体姿态与在座  （中）
#
# 因此参考句应重点描述手部与桌面，头部只描述朝向不描述目光。
# 详见 docs/ARCHITECTURE.md §4.2（duxue-server）。
# ─────────────────────────────────────────────────────────

categories:
  - label: "学习"
    icon: "📖"
    references:
      - "学生右手握笔在练习本上书写，左手按住纸张，桌面摊开着课本和文具"
      - "学生低头朝向桌面，手指停在书页上翻页，桌上摆着打开的书本"
      - "学生上身略前倾，双手放在摊开的练习册上，头部朝下对着桌面"
      - "学生握着铅笔在纸上移动，桌面可见课本、草稿纸和笔袋"
      - "学生端坐，头低向桌面方向，手部在书本区域内小幅活动"
      - "桌面摊开课本与作业本，学生一只手扶书一只手执笔，姿态稳定"

  - label: "离开"
    icon: "🚶"
    references:
      - "画面中没有学生，座位空置，桌面留着书本和文具"
      - "椅子空着，画面里看不到人，只有桌面和文具"
      - "学生已站起身，身体正移出画面边缘"
      - "座位区域无人，桌面物品保持原样未被触碰"
      - "画面中只有桌椅和桌面物品，没有任何人体部位"

  - label: "走神/玩耍"
    icon: "🎮"
    fallback: true   # 无法确定时默认归入此类
    references:
      - "学生手里拿着手机，头部低向手机屏幕方向，课本被推到一边"
      - "学生双手在摆弄一个玩具，桌面上的书本处于合拢或被推开的状态"
      - "学生头部转向侧方，身体后靠椅背，双手离开桌面书本区域"
      - "学生趴在桌面上，头枕在手臂里，身体长时间保持静止"
      - "学生上身扭转朝向侧后方，手部没有接触任何学习用品"
      - "学生手指反复拨弄桌上的非学习物品，如橡皮、卡片或小摆件"
      - "学生坐在椅子上身体大幅晃动，双手空置，桌面书本无翻动痕迹"

