# 分类层配置：关键词规则
# 用于"规则匹配"分类方式（方式 1）
#
# 匹配逻辑：按 priority 从高到低依次检查，
#           第一个命中的规则决定最终类别。
# 新增类别：直接添加新规则节。
#
# 【机位约束】关键词不得依赖眼睛、视线或面部表情——摄像头在侧后方
# 45° 俯拍，看不到正脸。头部相关只能用朝向词（低头/转向/抬头），
# 不能用目光词。详见 categories.yaml 头部说明。
#
# 【匹配范围】规则默认只在行为字段上匹配（hand_action / head_orientation /
# body_pos / seat_status / motion_state / desc_summary），不看 desk_objects。
# 可用 scope 显式覆盖。这条约束来自实测 badcase：桌上摆着手机、平板时，
# 静物清单里的"手机"会让写作业被判成玩手机。物品说明现场有什么，
# 不说明人在做什么——行为判据只能来自描述动作的字段。

rules:
  - label: "离开"
    icon: "🚶"
    priority: 10      # 最高优先级，先判断是否有人
    # 关键词必须足够具体：曾用过泛化的"空置"，会误匹配"双手空置"
    # 把转头走神判成离开。凡是可能出现在手部/桌面描述里的词都不能用。
    any_of:           # 描述中包含任意一个关键词即命中
      - "不在画面"
      - "画面中没有"
      - "画面里没有"
      - "无人"
      - "座位空置"
      - "座位空着"
      - "椅子空着"
      - "离开画面"
      - "离开座位"
      - "已离座"
      - "站起"
      - "走出"

  - label: "学习"
    icon: "📖"
    priority: 5
    # 只保留动作词。曾经把"练习本""作业本"也算作学习信号，但物品出现
    # 不等于正在使用——摊开的作业本旁边可以坐着一个在发呆的孩子。
    any_of:
      - "握笔"
      - "执笔"
      - "书写"
      - "写字"
      - "抄写"
      - "翻书"
      - "翻页"
      - "看书"
      - "阅读"
      - "做题"
      # 屏幕学习场景：只认明确的教学语义，不认"平板""电脑"本身，
      # 后者既能上网课也能看动画，单凭设备无法区分。
      - "网课"
      - "线上课程"
      - "教学视频"
      - "听课"
    # 排除条件：描述中同时含有以下词时，不判为学习
    none_of:
      - "玩具"
      - "手机"
      - "趴"

  - label: "走神/玩耍"
    icon: "🎮"
    priority: 1       # 最低优先级，作为兜底
    any_of:
      - "玩具"
      - "积木"
      - "手机"
      - "游戏"
      - "摆弄"
      - "拨弄"
      - "东张西望"
      - "转向侧方"
      - "朝向侧方"
      - "扭转"
      - "后靠"
      - "与他人说话"
      - "趴"
      - "双手空置"
      - "手部没有接触"

# 当所有规则都未命中时，使用此默认类别
default_label: "走神/玩耍"
