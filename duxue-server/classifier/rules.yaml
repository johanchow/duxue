# 分类层配置：关键词规则
# 用于"规则匹配"分类方式（方式 1）
#
# 匹配逻辑：按 priority 从高到低依次检查，
#           第一个命中的规则决定最终类别。
# 新增类别：直接添加新规则节。

rules:
  - label: "离开"
    icon: "🚶"
    priority: 10      # 最高优先级，先判断是否有人
    any_of:           # 描述中包含任意一个关键词即命中
      - "不在画面"
      - "无人"
      - "空置"
      - "离开画面"
      - "离开座位"
      - "站起"
      - "走出"

  - label: "学习"
    icon: "📖"
    priority: 5
    any_of:
      - "握笔"
      - "书写"
      - "写字"
      - "抄写"
      - "翻书"
      - "看书"
      - "阅读"
      - "做题"
      - "练习"
    # 排除条件：描述中同时含有以下词时，不判为学习
    none_of:
      - "玩具"
      - "手机"
      - "发呆"

  - label: "走神/玩耍"
    icon: "🎮"
    priority: 1       # 最低优先级，作为兜底
    any_of:
      - "玩具"
      - "积木"
      - "手机"
      - "游戏"
      - "发呆"
      - "东张西望"
      - "目光空洞"
      - "朝向侧方"
      - "与他人说话"
      - "趴着"
      - "趴下"

# 当所有规则都未命中时，使用此默认类别
default_label: "走神/玩耍"
