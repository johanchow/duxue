# Docker Desktop reaches the local SSH tunnel through host.docker.internal.
x-debug-environment: &debug-environment
  APP_ENV: test
  REDIS_URL: ""
  REDIS_HOST: host.docker.internal
  REDIS_PORT: "16379"
  REDIS_DB: "1"
  REDIS_USERNAME: duxue_test
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set the debug Redis password in .env}
  AUTO_CREATE_SCHEMA: "false"

services:
  migrate:
    environment: *debug-environment
  api:
    environment: *debug-environment
    volumes: ["./data/uploads:/app/data/uploads"]
  worker:
    environment: *debug-environment
    volumes: ["./data/uploads:/app/data/uploads"]
  solving-worker:
    environment: *debug-environment
    volumes: ["./data/uploads:/app/data/uploads"]
  beat:
    environment: *debug-environment
