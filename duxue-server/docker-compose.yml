services:
  api:
    build: .
    env_file: ${ENV_FILE:-.env}
    ports: ["8000:8000"]
    volumes: ["frame-data:/app/data/uploads"]
    depends_on: [postgres, redis]
  worker:
    build: .
    command: celery -A infrastructure.messaging.celery_tasks worker -l info
    env_file: ${ENV_FILE:-.env}
    volumes: ["frame-data:/app/data/uploads"]
    depends_on: [postgres, redis]
  beat:
    build: .
    command: celery -A infrastructure.messaging.celery_tasks beat -l info
    env_file: ${ENV_FILE:-.env}
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: duxue, POSTGRES_USER: duxue, POSTGRES_PASSWORD: duxue}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
volumes:
  frame-data:
  postgres-data:
