services:
  migrate:
    image: ${DUXUE_SERVER_IMAGE:-duxue-server:local}
    build: .
    command: alembic upgrade head
    env_file: ${ENV_FILE:-.env}
    profiles: ["tools"]

  api:
    image: ${DUXUE_SERVER_IMAGE:-duxue-server:local}
    build: .
    command: uvicorn app.bootstrap.app:app --host 0.0.0.0 --port 8000
    env_file: ${ENV_FILE:-.env}
    environment:
      OTEL_SERVICE_COMPONENT: api
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${DUXUE_SERVER_IMAGE:-duxue-server:local}
    build: .
    command: celery -A app.workers.celery_tasks worker -l info
    env_file: ${ENV_FILE:-.env}
    environment:
      OTEL_SERVICE_COMPONENT: worker
    restart: unless-stopped

  beat:
    image: ${DUXUE_SERVER_IMAGE:-duxue-server:local}
    build: .
    command: celery -A app.workers.celery_tasks beat -l info
    env_file: ${ENV_FILE:-.env}
    environment:
      OTEL_SERVICE_COMPONENT: beat
    restart: unless-stopped
