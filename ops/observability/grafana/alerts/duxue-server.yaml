apiVersion: 1
groups:
  - orgId: 1
    name: duxue-server
    folder: Duxue
    interval: 1m
    rules:
      - uid: duxue-llm-error-rate
        title: LLM error rate is high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              expr: sum(rate(duxue_llm_requests_total{llm_result="error"}[5m])) / clamp_min(sum(rate(duxue_llm_requests_total[5m])), 1)
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator: {type: gt, params: [0.05]}
                  operator: {type: and}
                  reducer: {type: last, params: []}
                  type: query
        for: 10m
        noDataState: NoData
        execErrState: Error
      - uid: duxue-batch-fallback
        title: VLM batch fallback ratio is high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: prometheus
            model:
              expr: sum(increase(duxue_batch_fallbacks_total[24h])) / clamp_min(sum(increase(duxue_batch_total[24h])), 1)
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator: {type: gt, params: [0.1]}
                  operator: {type: and}
                  reducer: {type: last, params: []}
                  type: query
        for: 15m
        noDataState: NoData
        execErrState: Error
      - uid: duxue-app-network-errors
        title: App client network error rate is high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              expr: sum(rate(app_http_total{service_name="duxue-app",app_result="error",app_status_class="network"}[5m])) / clamp_min(sum(rate(app_http_total{service_name="duxue-app"}[5m])), 1)
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator: {type: gt, params: [0.1]}
                  operator: {type: and}
                  reducer: {type: last, params: []}
                  type: query
        for: 15m
        noDataState: NoData
        execErrState: Error
